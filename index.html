<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>🎢 Critter Roller Coaster 3D: Star Track Rush! ⭐</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="game-shell">
    <canvas id="coaster-canvas"></canvas>

    <!-- Active Rainbow Fever Full-Screen Animated Border -->
    <div id="rainbow-fever-border" class="hidden" aria-hidden="true"></div>

    <!-- WebGL Blocked / Context Error Zero-Text Visual Fallback Card -->
    <div id="webgl-fallback" class="modal-backdrop hidden" role="alert">
      <div class="glass-modal">
        <div class="crown-bounce">🎢❌🖥️</div>
        <div id="webgl-fallback-chip">🎮🔄</div>
      </div>
    </div>

    <!-- Asset Loading Progress Ring Overlay -->
    <div id="loading-overlay" class="modal-backdrop hidden" aria-hidden="true">
      <div class="glass-modal">
        <div class="crown-bounce">🎢⏳✨</div>
        <div id="loading-bar-wrap">
          <div id="loading-bar-fill"></div>
        </div>
      </div>
    </div>

    <!-- Top Visual Rail: Character Picker + 8 Coaster Worlds + Podium Standings -->
    <header id="top-hud" aria-label="Visual Coaster HUD">
      <div id="top-bar-row">
        <!-- Active Critter Avatar Button (Opens 8-Critter Picker Tray) -->
        <button id="critter-picker-toggle" class="glass-pill" type="button" aria-label="Choose Critter">
          <img id="active-critter-img" src="icons/catnap.jpg" alt="" onerror="this.style.display='none'" />
          <span id="active-critter-emoji">🐱💜</span>
          <span class="caret-icon">▾</span>
        </button>

        <!-- 8 Coaster Worlds Stage Rail -->
        <nav id="stage-rail" class="glass-pill" aria-label="Coaster Worlds"></nav>

        <!-- Total Stars & Audio Toggle -->
        <div id="utility-cluster" class="glass-pill">
          <div id="total-stars-badge" aria-label="Total Stars">
            <span>⭐</span>
            <span id="total-stars-count">0</span>
          </div>
          <button id="camera-btn" class="icon-btn" type="button" aria-label="Camera Angle">🎥</button>
          <button id="sound-btn" class="icon-btn" type="button" aria-label="Toggle Sound">🔊</button>
        </div>
      </div>

      <!-- Collapsible 8-Critter Rider Selector Tray -->
      <div id="critter-drawer" class="glass-pill hidden" role="listbox" aria-label="Select Critter Rider"></div>

      <!-- Track Progress & 5-Cart Live Race Telemetry Bar (100% Icon-Only Gauges) -->
      <div id="race-telemetry-row">
        <div id="rank-pill" class="glass-pill" aria-label="Current Rank">
          <span id="rank-medal">🥇</span>
        </div>

        <div id="track-spline-bar" class="glass-pill">
          <span class="track-end-icon">🎢</span>
          <div id="track-line-wrap">
            <div id="track-fill-bar"></div>
            <div id="track-markers-layer"></div>
          </div>
          <span class="track-end-icon">🏁</span>
        </div>

        <div id="score-pill" class="glass-pill">
          <div class="stat-chip" aria-label="Star Coins">
            <span>🪙</span>
            <span id="coin-counter">0</span>
          </div>
          <div class="stat-chip" id="speed-gauge" aria-label="Coaster Speed">
            <span>💨</span>
            <div id="speed-segments" aria-hidden="true">
              <span class="speed-seg active"></span>
              <span class="speed-seg active"></span>
              <span class="speed-seg"></span>
              <span class="speed-seg"></span>
              <span class="speed-seg"></span>
            </div>
          </div>
        </div>
      </div>

      <!-- Live 5-Critter Leaderboard Chips -->
      <div id="live-standings-strip"></div>
    </header>

    <!-- Center Floating Visual Callouts (3-2-1-GO, Loop-de-Loop, Slam, Fever) -->
    <div id="center-callout" class="hidden" aria-live="polite">
      <div id="callout-icon">🎢✨</div>
      <div id="callout-sub">⭐⭐⭐</div>
    </div>

    <!-- Bottom Visual Cockpit: 3-Lane Coaster Switcher + Hop + 3 Power Pedals -->
    <footer id="bottom-cockpit" aria-label="Coaster Controls">
      <!-- Left Cluster: Track Lane Switch Left / Hop / Right -->
      <div id="steer-cluster" class="cockpit-cluster">
        <button id="btn-lane-left" class="coaster-btn steer-btn" type="button" aria-label="Switch Left Rail">
          <span class="btn-glyph">⬅️</span>
          <span class="btn-sub">🛤️</span>
          <span class="key-badge">◀</span>
        </button>
        <button id="btn-hop" class="coaster-btn hop-btn" type="button" aria-label="Cart Hop Over Barrier">
          <span id="hop-alert-badge" class="hidden">🚧</span>
          <span class="btn-glyph">🦘</span>
          <span class="btn-sub">⏫</span>
          <span class="key-badge">▲</span>
        </button>
        <button id="btn-lane-right" class="coaster-btn steer-btn" type="button" aria-label="Switch Right Rail">
          <span class="btn-glyph">➡️</span>
          <span class="btn-sub">🛤️</span>
          <span class="key-badge">▶</span>
        </button>
      </div>

      <!-- Center 3-Rail Visual Mini-Map + 16px Rainbow Fever Gauge -->
      <div id="fever-cockpit-core" class="glass-pill">
        <div id="lane-indicator-dots" aria-label="Active Coaster Rail">
          <span class="lane-dot" data-lane="0">🛤️</span>
          <span class="lane-dot active" data-lane="1">🛒</span>
          <span class="lane-dot" data-lane="2">🛤️</span>
        </div>
        <div id="fever-ring-wrap" aria-label="Rainbow Fever Meter">
          <div id="fever-bar-outer">
            <div id="fever-bar-fill"></div>
          </div>
          <span id="fever-icon">🌈</span>
        </div>
      </div>

      <!-- Right Cluster: 3 Power Pedals (1: Star Magnet, 2/Space: Loop Turbo, 3: Sideways Cart Slam) -->
      <div id="pedal-cluster" class="cockpit-cluster">
        <button id="pedal-magnet" class="coaster-btn pedal-btn pedal-1" type="button" aria-label="Star Magnet Tornado">
          <span class="pedal-cooldown-fill"></span>
          <span class="btn-glyph">🌪️</span>
          <span class="btn-sub">🧲⭐</span>
          <span class="key-badge">1</span>
        </button>
        <button id="pedal-turbo" class="coaster-btn pedal-btn pedal-2" type="button" aria-label="Loop-de-Loop Turbo">
          <span class="pedal-cooldown-fill"></span>
          <span class="btn-glyph">⚡</span>
          <span class="btn-sub">🚀🔄</span>
          <span class="key-badge">2</span>
        </button>
        <button id="pedal-slam" class="coaster-btn pedal-btn pedal-3" type="button" aria-label="Sideways Cart Slam">
          <span class="pedal-cooldown-fill"></span>
          <span class="btn-glyph">💥</span>
          <span class="btn-sub">🛒💫</span>
          <span class="key-badge">3</span>
        </button>
      </div>
    </footer>

    <!-- 5-Critter Finish Podium & Qualification Modal (100% Zero-Text Visual Overlay) -->
    <div id="podium-overlay" class="modal-backdrop hidden" role="dialog" aria-modal="true">
      <div id="podium-card" class="glass-modal">
        <div id="podium-header-badges">
          <span id="podium-result-crown" class="crown-bounce">🏆</span>
          <div id="podium-stars-row">
            <span class="podium-star" data-star="1">⭐</span>
            <span class="podium-star" data-star="2">⭐</span>
            <span class="podium-star" data-star="3">⭐</span>
          </div>
          <div id="podium-rank-chip">🥇</div>
        </div>

        <!-- 5-Critter Podium Pillars -->
        <div id="podium-stage-grid"></div>

        <!-- Qualification Rule Visual Legend (🥇⭐⭐⭐ | 🥈⭐⭐ | 🥉⭐ | 4-5 🔄) -->
        <div id="qualification-rule-strip">
          <span class="qual-chip pass">🥇⭐⭐⭐</span>
          <span class="qual-chip pass">🥈⭐⭐</span>
          <span class="qual-chip pass">🥉⭐</span>
          <span class="qual-chip fail">4️⃣5️⃣ ❌🔄</span>
        </div>

        <!-- Action Buttons: Retry Always Visible; Next Stage ONLY on Top-3 Finish -->
        <div id="podium-actions">
          <button id="btn-retry-stage" class="modal-action-btn retry-btn" type="button" aria-label="Retry Coaster">
            <span>🔄</span>
            <span>🎢</span>
          </button>
          <button id="btn-next-stage" class="modal-action-btn next-btn" type="button" aria-label="Next Coaster World">
            <span>⏭️</span>
            <span>🌟</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/vendor/three.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
